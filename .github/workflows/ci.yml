name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  malware-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout submitted commit without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Scan for known malware indicators
        run: node scripts/security/scan-malware.mjs

  check:
    needs: malware-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:prod
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - name: Verify deployed documentation links
        run: pnpm check:docs-links
      - name: Validate performance budgets
        run: pnpm performance:check
      - run: pnpm test:e2e
      - name: Run accessibility tests (desktop + mobile)
        run: pnpm test:e2e:a11y

  check-generated-code:
    needs: malware-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify backend pin checksum
        run: pnpm run verify-backend-pin
      - name: Regenerate client from pinned OpenAPI
        run: pnpm run generate-client
      - name: Check for stale generated code
        run: git diff --exit-code -- src/services/api/client.generated.ts
      - name: Type check for API compatibility
        run: pnpm typecheck
